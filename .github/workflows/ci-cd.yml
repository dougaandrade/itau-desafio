name: CI/CD Pipeline - Itaú Desafio

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Etapa 1: Build e Testes do Java
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Run Tests
        run: ./mvnw test

  # Etapa 2: Construir e Publicar imagem Docker (apenas se o build passar)
  publish-docker:
    needs: build-and-test
    if: github.event_name == 'push' # Só publica ao fazer merge na main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/itau-desafio:latest
